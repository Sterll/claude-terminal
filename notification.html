<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; style-src 'self' 'unsafe-inline'; navigate-to 'none'">
  <title>Notification</title>
  <style>
    /* Mirrors the in-app toast (styles/ambience.css): a frosted card on the
       theme's own surface, no stripe, the type colour only on the icon. This
       window cannot import the app's stylesheet - it is a standalone
       BrowserWindow - so the tokens it needs are restated here, and the theme's
       surface, text and accent come in with the payload (meta.theme). */
    @property --p {
      syntax: '<number>';
      inherits: true;
      initial-value: 1;
    }

    :root {
      --surface: #1a1a1a;
      --text-primary: #e8e8e8;
      --text-secondary: #a7a7a7;
      --accent: #d97706;
      --type-accent: var(--accent);
      --pad: 8px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body { background: transparent; }

    body {
      font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
      overflow: hidden;
      -webkit-app-region: no-drag;
      padding: var(--pad);
      -webkit-font-smoothing: antialiased;
    }

    .notification {
      position: relative;
      display: flex;
      align-items: center;
      gap: 11px;
      /* The window is sized to the card (fitToContent below); min-height only
         covers the frame before that lands. */
      min-height: calc(100vh - 2 * var(--pad));
      padding: 10px 10px 10px 11px;
      background: color-mix(in srgb, var(--surface) 94%, transparent);
      border: 1px solid color-mix(in srgb, var(--text-primary) 9%, transparent);
      border-radius: 14px;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.38), inset 0 1px 0 color-mix(in srgb, var(--text-primary) 5%, transparent);
      overflow: hidden;
      opacity: 0;
      transform: translateX(28px);
      transition: opacity 0.22s ease, transform 0.34s cubic-bezier(0.2, 1.2, 0.3, 1), background-color 0.15s;
    }
    .notification.shown { opacity: 1; transform: none; }
    .notification.leaving {
      opacity: 0;
      transform: translateX(28px);
      transition: opacity 0.18s ease, transform 0.2s ease-in;
    }

    /* A notification with nothing to choose is one click: the whole card opens it. */
    .notification.has-actions { align-items: flex-start; }
    .notification.clickable { cursor: pointer; }
    .notification.clickable:hover { background: color-mix(in srgb, var(--surface) 88%, var(--text-primary) 6%); }

    .notification.type-question { --type-accent: #a855f7; }
    .notification.type-permission { --type-accent: var(--accent); }
    .notification.type-plan { --type-accent: #3b82f6; }
    .notification.type-info { --type-accent: #3b82f6; }
    .notification.type-done { --type-accent: #22c55e; }

    /* The icon disc doubles as the countdown: a ring that empties until the
       card goes, paused while the pointer is on it. */
    .notif-icon {
      position: relative;
      width: 30px;
      height: 30px;
      flex-shrink: 0;
      display: grid;
      place-items: center;
      border-radius: 50%;
      color: var(--type-accent);
      background: color-mix(in srgb, var(--type-accent) 15%, transparent);
    }
    .notif-icon svg { width: 14px; height: 14px; position: relative; }
    .notif-icon::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: conic-gradient(color-mix(in srgb, var(--type-accent) 75%, transparent) calc(var(--p) * 1turn), transparent 0);
      -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 2px), #000 calc(100% - 1.5px));
      opacity: 0;
    }
    .notification.timed .notif-icon::before {
      opacity: 1;
      animation: countdown var(--dismiss-time, 5000ms) linear forwards;
    }
    .notification.timed:hover .notif-icon::before { animation-play-state: paused; }

    @keyframes countdown {
      from { --p: 1; }
      to { --p: 0; }
    }

    .notif-content {
      flex: 1 1 auto;
      min-width: 0;
    }

    .notif-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-primary);
      line-height: 1.3;
      letter-spacing: -0.005em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .notif-body {
      margin-top: 1px;
      font-size: 12px;
      color: var(--text-secondary);
      line-height: 1.35;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .notif-body:empty { display: none; }
    /* A question or a permission needs its text: two lines there. */
    .notification.has-actions .notif-body {
      white-space: normal;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
    }

    .notif-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 8px;
    }
    .notif-actions:empty { display: none; }

    .btn {
      padding: 5px 11px;
      border: none;
      border-radius: 8px;
      font-size: 11.5px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: background-color 0.15s, color 0.15s, filter 0.15s, transform 0.12s;
      white-space: nowrap;
      max-width: 160px;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .btn:active { transform: scale(0.96); }

    .btn-primary {
      background: var(--type-accent);
      color: #0a0a0a;
    }
    .btn-primary:hover { filter: brightness(1.1); }

    .btn-secondary {
      background: color-mix(in srgb, var(--text-primary) 9%, transparent);
      color: var(--text-primary);
    }
    .btn-secondary:hover { background: color-mix(in srgb, var(--text-primary) 15%, transparent); }

    .btn-danger {
      background: color-mix(in srgb, #ef4444 14%, transparent);
      color: #f87171;
    }
    .btn-danger:hover { background: color-mix(in srgb, #ef4444 22%, transparent); }

    .btn-ghost {
      background: transparent;
      color: var(--text-secondary);
      font-weight: 500;
    }
    .btn-ghost:hover { color: var(--text-primary); }

    /* Visible at rest, quieter than the content: a control that only appears on
       hover is one the user has to hunt for. */
    .notif-close {
      flex-shrink: 0;
      align-self: flex-start;
      width: 22px;
      height: 22px;
      display: grid;
      place-items: center;
      padding: 0;
      border: none;
      border-radius: 7px;
      background: transparent;
      color: color-mix(in srgb, var(--text-secondary) 70%, transparent);
      cursor: pointer;
      transition: background-color 0.15s, color 0.15s;
    }
    .notification:not(.has-actions) .notif-close { align-self: center; }
    .notif-close svg { width: 12px; height: 12px; }
    .notif-close:hover { color: var(--text-primary); background: color-mix(in srgb, var(--text-primary) 10%, transparent); }
    .notif-close:focus-visible { outline: 2px solid var(--type-accent); outline-offset: 1px; }

    @media (prefers-reduced-motion: reduce) {
      .notification, .notification.leaving { transition: opacity 0.15s; transform: none; }
    }
  </style>
</head>
<body>
  <div class="notification" id="notification">
    <div class="notif-icon" id="notif-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
    </div>
    <div class="notif-content">
      <div class="notif-title" id="title"></div>
      <div class="notif-body" id="body"></div>
      <div class="notif-actions" id="notif-actions"></div>
    </div>
    <button class="notif-close" id="closeBtn" aria-label="Close">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
  </div>

  <script>
    // notifAPI est exposé par preload-notification.js via contextBridge

    const params = new URLSearchParams(window.location.search);
    let data = {};
    try {
      data = JSON.parse(decodeURIComponent(params.get('data') || '{}')) || {};
    } catch (e) {
      // Malformed payload — keep an empty object so the window can still self-dismiss
      data = {};
    }
    const { title, body, terminalId, notifId, autoDismiss, buttons, meta } = data;

    // Load accent color and language (notifAPI may be absent if the preload failed)
    const accentColor = (window.notifAPI && notifAPI.readSettingsAccentColor)
      ? notifAPI.readSettingsAccentColor()
      : null;
    if (accentColor) {
      document.documentElement.style.setProperty('--accent', accentColor);
    }
    // The theme's own colours, so the card sits in the same palette as the app.
    // Only plain hex reaches a style property.
    var HEX = /^#[0-9a-f]{3,8}$/i;
    var themeColors = (meta && meta.theme) || {};
    [['surface', '--surface'], ['text', '--text-primary'], ['textSecondary', '--text-secondary'], ['accent', '--accent']].forEach(function(pair) {
      var v = themeColors[pair[0]];
      if (typeof v === 'string' && HEX.test(v.trim())) document.documentElement.style.setProperty(pair[1], v.trim());
    });
    const lang = (window.notifAPI && notifAPI.readSettingsLanguage)
      ? (notifAPI.readSettingsLanguage() || 'en')
      : 'en';
    document.documentElement.lang = lang;

    // Fill content
    document.getElementById('title').textContent = title || '';
    document.getElementById('body').textContent = body || '';

    // Icon + accent come from the notification type. The colour is set once, as a
    // class on the root, so the stripe, the icon disc, the primary button and the
    // progress bar all derive from the same value — as they do for in-app toasts.
    var NOTIF_ICONS = {
      done: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>',
      question: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>',
      permission: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>',
      plan: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>',
      info: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>'
    };

    var notifType = (meta && meta.notifType) || 'done';
    if (!NOTIF_ICONS[notifType]) notifType = 'done';
    document.getElementById('notif-icon').innerHTML = NOTIF_ICONS[notifType];
    document.getElementById('notification').classList.add('type-' + notifType);

    var cardEl = document.getElementById('notification');

    // Render buttons. A lone "show" button is not a choice: the whole card is
    // the click, and no button row makes the card taller for nothing.
    var actionsDiv = document.getElementById('notif-actions');
    var btnList = (buttons && buttons.length > 0)
      ? buttons
      : [{ label: 'Show', action: 'show', style: 'primary' }];

    function sendAction(btn) {
      if (window.notifAPI && notifAPI.send) {
        notifAPI.send('notification-action', {
          action: btn.action,
          terminalId: terminalId,
          value: btn.value || null,
          requestId: (meta && meta.requestId) || null
        });
      }
      dismiss();
    }

    if (btnList.length === 1 && btnList[0].action === 'show') {
      cardEl.classList.add('clickable');
      cardEl.title = btnList[0].label || '';
      cardEl.addEventListener('click', function(e) {
        if (e.target.closest('#closeBtn')) return;
        sendAction(btnList[0]);
      });
    } else {
      cardEl.classList.add('has-actions');
      btnList.forEach(function(btn) {
        var el = document.createElement('button');
        el.className = 'btn btn-' + (btn.style || 'primary');
        el.textContent = btn.label;
        el.addEventListener('click', function() { sendAction(btn); });
        actionsDiv.appendChild(el);
      });
    }

    // Close button
    document.getElementById('closeBtn').addEventListener('click', function(e) { e.stopPropagation(); dismiss(); });

    // Escape key
    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') dismiss();
    });

    // Auto-dismiss (autoDismiss: 0 = stays until the user acts). The ring on the
    // icon shows the time left; the pointer on the card holds it.
    var autoDismissTimer = null;
    var remaining = autoDismiss && autoDismiss > 0 ? autoDismiss : 0;
    var startedAt = 0;
    function arm() {
      startedAt = Date.now();
      autoDismissTimer = setTimeout(function() { dismiss(); }, remaining);
    }
    if (remaining) {
      cardEl.style.setProperty('--dismiss-time', remaining + 'ms');
      cardEl.classList.add('timed');
      arm();
      cardEl.addEventListener('mouseenter', function() {
        if (!autoDismissTimer) return;
        clearTimeout(autoDismissTimer);
        autoDismissTimer = null;
        remaining = Math.max(400, remaining - (Date.now() - startedAt));
      });
      cardEl.addEventListener('mouseleave', function() {
        if (!autoDismissTimer && !dismissed) arm();
      });
    }

    // The window is created at an estimated height - main cannot know how many
    // lines the body wraps to, nor how many rows the buttons take - so the last
    // thing this script does is measure the real card and ask for that height.
    // Without it, a two-line body pushed the action row past the window edge.
    function fitToContent() {
      if (!(window.notifAPI && notifAPI.send)) return;
      var el = document.getElementById('notification');
      // min-height ties the card to the current window height, so measuring with
      // it on reports back whatever the window already is and never shrinks.
      el.style.minHeight = '0';
      var pad = parseFloat(getComputedStyle(document.body).paddingTop) || 0;
      var needed = Math.ceil(el.getBoundingClientRect().height + pad * 2);
      el.style.minHeight = '';
      notifAPI.send('notification-resize', { notifId: notifId, height: needed });
    }
    requestAnimationFrame(function() {
      fitToContent();
      // In on the next frame, once the window has its size.
      requestAnimationFrame(function() { cardEl.classList.add('shown'); });
    });

    // Dismiss
    var dismissed = false;
    function dismiss() {
      if (dismissed) return;
      dismissed = true;
      if (autoDismissTimer) clearTimeout(autoDismissTimer);
      var send = function() {
        if (window.notifAPI && notifAPI.send) notifAPI.send('notification-dismiss', { notifId: notifId });
      };
      // Out first, then closed; the timeout covers a transition that never ends.
      cardEl.classList.add('leaving');
      var sent = false;
      var once = function() { if (sent) return; sent = true; send(); };
      cardEl.addEventListener('transitionend', once);
      setTimeout(once, 260);
    }
  </script>
</body>
</html>
