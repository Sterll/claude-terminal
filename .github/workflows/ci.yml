name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Cheap and Ubuntu-only, so a stale CLAUDE.md or a boundary violation is
  # reported in seconds rather than after the full 6-way test matrix.
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: 20
          cache: npm

      - name: Check CLAUDE.md against the tree
        run: node scripts/check-docs.js

      # --ignore-scripts skips the electron-rebuild postinstall: linting needs
      # no native modules, and rebuilding node-pty here would cost minutes.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: ESLint
        run: npm run lint

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        node-version: [18, 20]

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build renderer
        run: npm run build:renderer

      - name: Run tests
        run: npm test

  # Launches the real Electron app and clicks through every sidebar tab —
  # the one thing the 125 jsdom suites structurally cannot check.
  #
  # continue-on-error while it settles in. It drives a real window under a
  # virtual display, and neither a flaky Xvfb nor a panel that turns out to log
  # a benign console error on a blank profile should red-flag an unrelated PR.
  # Once a few runs have shown what the real-world noise is, drop this.
  e2e:
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: 20
          cache: npm

      # Full install, unlike the lint job: this one runs the app, so node-pty,
      # keytar and better-sqlite3 have to be rebuilt against Electron's ABI.
      - name: Install dependencies
        run: npm ci

      # Electron is Chromium, so Playwright already knows the exact library set
      # it needs on this Ubuntu release — better than hand-listing packages that
      # get renamed between LTS versions (libasound2 -> libasound2t64, and so on).
      # xvfb provides the display; libsecret is keytar's, not Chromium's, so
      # neither comes from install-deps.
      - name: Install Linux runtime libraries
        run: |
          sudo npx playwright install-deps chromium
          sudo apt-get install -y xvfb libsecret-1-0

      - name: Build renderer
        run: npm run build:renderer

      - name: Smoke test
        run: xvfb-run --auto-servernum npm run test:e2e
