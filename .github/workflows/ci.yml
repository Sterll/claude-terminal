name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Cheap and Ubuntu-only, so a stale CLAUDE.md or a boundary violation is
  # reported in seconds rather than after the full 6-way test matrix.
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: 20
          cache: npm

      - name: Check CLAUDE.md against the tree
        run: node scripts/check-docs.js

      # --ignore-scripts skips the electron-rebuild postinstall: linting needs
      # no native modules, and rebuilding node-pty here would cost minutes.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: ESLint
        run: npm run lint

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        node-version: [18, 20]

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build renderer
        run: npm run build:renderer

      - name: Run tests
        run: npm test

  # Coverage, deliberately off the test matrix.
  #
  # Instrumenting ChatView.js and TerminalManager.js roughly triples the suite's
  # runtime, and running that six times over (Node 18/20 x three OSes) would buy
  # nothing: coverage is a property of the tests, not of the platform. One
  # Ubuntu/Node 20 run, alongside `lint`, is the whole signal.
  #
  # The thresholds in package.json are a ratchet, not a target. Each one was
  # measured and then set a little below what it measured, so this job is green
  # the day it lands — same reasoning as eslint.config.js: a check that is red
  # on arrival gets ignored, and then it guards nothing. They are scoped to the
  # directories that are genuinely unit-testable (src/shared/, src/main/services/,
  # src/renderer/utils/, src/renderer/state/) plus a low global floor that exists
  # only to catch tests being deleted wholesale. Raise a number when real
  # coverage clears it; never raise one aspirationally.
  coverage:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: 20
          cache: npm

      # --ignore-scripts as in the lint job: the jsdom suites run against a
      # mocked window.electron_api and never touch node-pty, keytar or sqlite,
      # so rebuilding them against Electron's ABI here would cost minutes.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Jest with coverage
        run: npm run test:coverage

  # Launches the real Electron app and clicks through every sidebar tab —
  # the one thing the 148 jsdom suites structurally cannot check, since they
  # all run against a mocked window.electron_api and never start the process.
  #
  # Blocking, deliberately. It shipped `continue-on-error` for one commit and
  # in that window it failed twice while the run still reported success, so
  # nobody saw it. A test that cannot fail the build reports nothing. If it
  # turns out to be flaky under Xvfb, that is worth seeing and fixing rather
  # than muting.
  e2e:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: 20
          cache: npm

      # Full install, unlike the lint job: this one runs the app, so node-pty,
      # keytar and better-sqlite3 have to be rebuilt against Electron's ABI.
      - name: Install dependencies
        run: npm ci

      # Electron is Chromium, so Playwright already knows the exact library set
      # it needs on this Ubuntu release — better than hand-listing packages that
      # get renamed between LTS versions (libasound2 -> libasound2t64, and so on).
      # xvfb provides the display; libsecret is keytar's, not Chromium's, so
      # neither comes from install-deps.
      - name: Install Linux runtime libraries
        run: |
          sudo npx playwright install-deps chromium
          sudo apt-get install -y xvfb libsecret-1-0

      - name: Build renderer
        run: npm run build:renderer

      - name: Smoke test
        run: xvfb-run --auto-servernum npm run test:e2e
